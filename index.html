<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Живых Обоев</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Левая часть: холст для генерации -->
    <main class="preview-area">
      <canvas id="wallpaperCanvas"></canvas>
    </main>

    <!-- Правая часть: панель настроек -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Настройки</h2>
        <p>Настройте параметры обоев под себя</p>
      </div>

      <div class="controls">
        <!-- Группа режимов -->
        <div class="control-group">
          <h3>Режим расположения</h3>
          <label class="control-item">
            <span>Режим</span>
            <select id="layoutMode" class="select-input">
              <option value="random">Хаотичный</option>
              <option value="grid">Сетка</option>
            </select>
          </label>
        </div>

        <!-- Группа настроек фона -->
        <div class="control-group">
          <h3>Фон</h3>
          <label class="control-item">
            <span>Цвет фона</span>
            <input type="color" id="bgColor" value="#000000">
          </label>
        </div>

        <!-- Группа настроек точек -->
        <div class="control-group">
          <h3>Точки</h3>
          <label class="control-item" id="dotCountContainer">
            <span>Количество точек</span>
            <input type="range" id="dotCount" min="10" max="1000" value="150">
          </label>
          <label class="control-item" id="gridSpacingContainer" style="display: none;">
            <span>Шаг сетки (px)</span>
            <input type="range" id="gridSpacing" min="15" max="100" value="35">
          </label>
          <label class="control-item">
            <span>Размер точек</span>
            <input type="range" id="dotSize" min="1" max="10" value="2">
          </label>
          <label class="control-item">
            <span>Скорость мерцания</span>
            <input type="range" id="flickerSpeed" min="1" max="10" value="5">
          </label>
        </div>

        <!-- Экспорт -->
        <div class="control-group">
          <h3>Экспорт</h3>
          <button id="btnExportPng" class="btn btn-primary">Cкачать PNG</button>
          <button id="btnExportMp4" class="btn btn-secondary" disabled title="Добавим на следующем шаге">Cкачать MP4 (Скоро)</button>
        </div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
