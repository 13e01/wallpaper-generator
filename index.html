<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Живых Обоев</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <main class="preview-area">
      <canvas id="wallpaperCanvas"></canvas>
    </main>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Настройки</h2>
        <p>Настройте параметры обоев под себя</p>
      </div>

      <div class="controls">
        <div class="control-group">
          <h3>Режим и Движение</h3>
          <label class="control-item">
            <span>Расположение</span>
            <select id="layoutMode" class="select-input">
              <option value="grid" selected>Сетка (Классическая)</option>
              <option value="drones">Шоу дронов (Волны)</option>
              <option value="random">Хаотичный</option>
            </select>
          </label>
          <label class="control-item" id="waveModeContainer" style="display: none;">
            <span>Тип волны</span>
            <select id="waveMode" class="select-input">
              <option value="horizontal">Горизонтальная</option>
              <option value="radial">Радиальная</option>
              <option value="diagonal">Диагональная</option>
            </select>
          </label>
          <label class="control-item">
            <span>Тип движения</span>
            <select id="moveMode" class="select-input">
              <option value="static" selected>Статично (Мерцание)</option>
              <option value="drift">Дрейф (Космос)</option>
              <option value="fly">Полёт (Кометы)</option>
            </select>
          </label>
          <label class="control-item" id="flyDirectionContainer" style="display: none;">
            <span>Направление полёта</span>
            <select id="flyDirection" class="select-input">
              <option value="random">Случайно</option>
              <option value="right">Вправо ➔</option>
              <option value="left">Влево ⬅</option>
              <option value="down">Вниз ⬇</option>
              <option value="up">Вверх ⬆</option>
              <option value="down-right">По диагонали ↘</option>
            </select>
          </label>
        </div>

        <div class="control-group">
          <h3>Внешний вид</h3>
          <label class="control-item">
            <span>Цвет фона</span>
            <input type="color" id="bgColor" value="#000000">
          </label>
          <label class="control-item">
            <span>Цвет точек</span>
            <input type="color" id="dotColor" value="#ffffff">
          </label>
          <label class="control-item">
            <span>Форма элементов</span>
            <select id="dotShape" class="select-input">
              <option value="circle">Круги</option>
              <option value="square">Квадраты</option>
              <option value="diamond">Ромбы</option>
            </select>
          </label>
          <label class="control-item" id="trailContainer" style="display: none;">
            <span>Длина шлейфа (Trails)</span>
            <input type="range" id="trailLength" min="1" max="9" value="5">
          </label>
        </div>

        <div class="control-group">
          <h3>Параметры сетки и частиц</h3>
          <label class="control-item" id="dotCountContainer" style="display: none;">
            <span>Количество точек</span>
            <input type="range" id="dotCount" min="10" max="1000" value="150">
          </label>
          <label class="control-item" id="gridSpacingContainer">
            <span>Шаг сетки (px)</span>
            <input type="range" id="gridSpacing" min="15" max="100" value="35">
          </label>
          <label class="control-item">
            <span>Размер точек</span>
            <input type="range" id="dotSize" min="1" max="10" value="2">
          </label>
          <label class="control-item" id="waveWidthContainer" style="display: none;">
            <span>Ширина волны</span>
            <input type="range" id="waveWidth" min="1" max="20" value="8">
          </label>
          <label class="control-item">
            <span>Скорость</span>
            <input type="range" id="flickerSpeed" min="1" max="10" value="5">
          </label>
        </div>

        <div class="control-group">
          <h3>Запись петли (Loop)</h3>
          <label class="control-item">
            <span>Длина видео</span>
            <select id="loopDuration" class="select-input">
              <option value="4">4 сек</option>
              <option value="6" selected>6 сек</option>
              <option value="8">8 сек</option>
            </select>
          </label>
          <label class="control-item">
            <span>Формат</span>
            <select id="exportFormat" class="select-input">
              <option value="webm" selected>WebM</option>
              <option value="mp4">MP4 (H.264)</option>
            </select>
          </label>
          <label class="control-item">
            <span>Разрешение</span>
            <select id="exportResolution" class="select-input">
              <option value="native" selected>Экранное (1:1)</option>
              <option value="1080p">Full HD (1920x1080)</option>
              <option value="720p">HD (1280x720)</option>
              <option value="4k">4K Ultra HD (3840x2160)</option>
            </select>
          </label>
          <label class="control-item">
            <span>Качество (Bitrate)</span>
            <select id="exportQuality" class="select-input">
              <option value="5000000">Низкое (5 Mbps)</option>
              <option value="12000000" selected>Среднее (12 Mbps)</option>
              <option value="25000000">Высокое (25 Mbps)</option>
              <option value="50000000">Ультра (50 Mbps)</option>
            </select>
          </label>
          <button id="btnExportPng" class="btn btn-primary">Скачать PNG</button>
          <button id="btnExportMp4" class="btn btn-secondary">Записать видео</button>
        </div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
